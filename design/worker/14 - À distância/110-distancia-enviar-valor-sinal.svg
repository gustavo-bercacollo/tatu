  <text x="168.5" y="80" font-size="16" font-weight="600" fill="#000000" text-anchor="start">Ana Martins</text>
  <text x="168.5" y="96" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="start">Cliente</text>
  <rect x="20" y="118" width="353" height="56" rx="14" fill="#F2F2F7"/>
  <text x="34" y="142" font-size="13" font-weight="600" fill="#000000" text-anchor="start">Chamado · Designer</text>
  <text x="34" y="162" font-size="13" font-weight="400" fill="#8E8E93" text-anchor="start">Logo para loja de bolos</text>
  <text x="359" y="152" font-size="12" font-weight="500" fill="#8E8E93" text-anchor="end">À distância</text>
  <text x="196.5" y="206" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle">Você aceitou o chamado. Combinem o valor por aqui.</text>
  <rect x="104.125" y="224" width="268.875" height="44" rx="20" fill="#1C1C1E"/>
  <text x="120.125" y="251" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Oi, Ana! Que estilo você imagina?</text>
  <rect x="20" y="282" width="202.03125" height="44" rx="20" fill="#EEEEF0"/>
  <text x="36" y="309" font-size="15" font-weight="400" fill="#000000" text-anchor="start">Algo simples e colorido.</text>
  <rect x="0" y="0" width="393" height="852" rx="0" fill="#000" opacity="0.38"/>
  <rect x="0" y="290" width="393" height="592" rx="30" fill="#fff"/>
  <rect x="178.5" y="298" width="36" height="5" rx="2.5" fill="#C7C7CC"/>
  <text x="24" y="346" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Quanto vai custar?</text>
  <text x="24" y="372" font-size="14" font-weight="400" fill="#8E8E93" text-anchor="start">À distância não tem visita.</text>
  <rect x="24" y="392" width="345" height="76" rx="16" fill="#EEEEF0"/>
  <rect x="24" y="392" width="345" height="76" rx="16" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="40" y="414" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="start">Serviço</text>
  <text x="40" y="450" font-size="26" font-weight="700" fill="#000000" text-anchor="start" letter-spacing="-0.5">R$ 250</text>
  <rect x="24" y="480" width="345" height="64" rx="16" fill="#EEEEF0"/>
  <text x="40" y="502" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="start">Pedir sinal</text>
  <text x="40" y="530" font-size="20" font-weight="700" fill="#000000" text-anchor="start">R$ 75</text>
  <rect x="302" y="496" width="51" height="31" rx="15.5" fill="#34C759"/>
  <circle cx="337.5" cy="511.5" r="13" fill="#fff"/>
  <text x="24" y="566" font-size="13" font-weight="400" fill="#8E8E93" text-anchor="start">Até 30% do valor. Você recebe o sinal ao mandar</text>
  <text x="24" y="584" font-size="13" font-weight="400" fill="#8E8E93" text-anchor="start">a 1ª entrega, mesmo se a Ana não aprovar.</text>
  <rect x="24" y="604" width="345" height="94" rx="16" fill="#F2F2F7"/>
  <text x="40" y="630" font-size="13" font-weight="600" fill="#000000" text-anchor="start">Você recebe</text>
  <text x="40" y="656" font-size="14" font-weight="400" fill="#8E8E93" text-anchor="start">Taxa do Tatu (10%)</text>
  <text x="353" y="656" font-size="14" font-weight="400" fill="#8E8E93" text-anchor="end">− R$ 25,00</text>
  <text x="40" y="680" font-size="14" font-weight="600" fill="#000000" text-anchor="start">No seu Pix</text>
  <text x="353" y="680" font-size="14" font-weight="600" fill="#000000" text-anchor="end">R$ 225,00</text>
  <rect x="24" y="714" width="345" height="56" rx="28.0" fill="#1C1C1E"/>
  <text x="196.5" y="748.0" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Enviar para Ana</text>
