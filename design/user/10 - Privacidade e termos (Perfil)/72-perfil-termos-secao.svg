  <text x="52" y="34" font-size="16" font-weight="600" fill="#000000" text-anchor="middle">9:41</text>
  <rect x="298" y="27" width="3" height="5" rx="1" fill="#000000"/>
  <rect x="303" y="24" width="3" height="8" rx="1" fill="#000000"/>
  <rect x="308" y="21" width="3" height="11" rx="1" fill="#000000"/>
  <rect x="313" y="18" width="3" height="14" rx="1" fill="#000000"/>
  <rect x="331" y="21" width="24" height="12" rx="4" fill="none" stroke="#000000" stroke-width="1" opacity="0.5"/>
  <rect x="333" y="23" width="17" height="8" rx="2.5" fill="#000000"/>
  <circle cx="40" cy="82" r="18" fill="#EEEEF0"/>
  <g transform="translate(31,73) scale(0.75)" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></g>
  <text x="196.5" y="88" font-size="17" font-weight="600" fill="#000000" text-anchor="middle">Termos de uso</text>
  <text x="24" y="152" font-size="24" font-weight="700" fill="#000000" text-anchor="start" letter-spacing="-0.4">8. Valor, pagamento e taxa</text>
  <text x="24" y="208" font-size="16" font-weight="700" fill="#000000" text-anchor="start">8.1. Valor combinado</text>
  <text x="24" y="232" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">O profissional propõe o valor no chat. No</text>
  <text x="24" y="253" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">local, ele pode separar Visita e Serviço.</text>
  <text x="24" y="274" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">São até 3 rodadas; sem acordo, nada é cobrado.</text>
  <text x="24" y="333" font-size="16" font-weight="700" fill="#000000" text-anchor="start">8.2. Reserva e cobrança</text>
  <text x="24" y="357" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">Ao confirmar, o total fica reservado no seu</text>
  <text x="24" y="378" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">cartão. A cobrança acontece sozinha quando</text>
  <text x="24" y="399" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">o serviço é concluído.</text>
  <text x="24" y="458" font-size="16" font-weight="700" fill="#000000" text-anchor="start">8.3. Pagamento só pelo app</text>
  <text x="24" y="482" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">É proibido pagar ou cobrar por fora. Quem</text>
  <text x="24" y="503" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">paga por fora perde as garantias do Tatu.</text>
  <text x="24" y="562" font-size="16" font-weight="700" fill="#000000" text-anchor="start">8.9. Gorjeta</text>
  <text x="24" y="586" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">Opcional, depois do serviço. Vai 100% para</text>
  <text x="24" y="607" font-size="15" font-weight="400" fill="#8E8E93" text-anchor="start">o profissional, menos a taxa do cartão.</text>
  <rect x="0" y="762" width="393" height="90" rx="0" fill="#fff"/>
  <line x1="0" y1="762" x2="393" y2="762" stroke="#D9D9DC" stroke-width="0.5"/>
  <text x="36" y="802" font-size="15" font-weight="600" fill="#007AFF" text-anchor="start">‹ 7. Pedido</text>
  <text x="357" y="802" font-size="15" font-weight="600" fill="#007AFF" text-anchor="end">9. No local ›</text>
  <rect x="129.5" y="843" width="134" height="5" rx="2.5" fill="#000000"/>
</svg>
