<style>
/* Layout: barra fixa no topo + tela de fluxograma (pan/zoom) + painel de detalhe à direita (folha embaixo no celular). */
:root {
  --bg: #F4F4F7;
  --grid: #DEDEE5;
  --surface: #FFFFFF;
  --surface-2: #EEEEF2;
  --ink: #0B0B0C;
  --muted: #6B6B73;
  --line: #D6D6DD;
  --edge: #2C2C30;
  --edge-auto: #9A9AA3;
  --app: #1E8E45;
  --app-dot: #34C759;
  --app-soft: #E3F6E9;
  --wip: #A85F00;
  --wip-dot: #FF9F0A;
  --wip-soft: #FFF2DE;
  --sync: #007AFF;
  --sync-soft: #E2EEFF;
  --lane: rgb(255 255 255 / .55);
  --e-entrada: #5B57C9; --e-pedir: #8A2E5E; --e-procurar: #A55B1E; --e-combinar: #2E7D3E; --e-contaC: #2F6AA8;
  --e-cadastro: #6B45B3; --e-chamados: #A3482A; --e-servico: #23786E; --e-contaP: #52657A;
  --lane-line: #D2D2DA;
  --font-ui: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 6px 18px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0F11; --grid: #24242A; --surface: #19191C; --surface-2: #232328; --ink: #F2F2F5; --muted: #9C9CA6;
  --line: #34343B; --edge: #D8D8DE; --edge-auto: #6E6E78; --app: #4CD07A; --app-dot: #34C759; --app-soft: #12301D;
  --wip: #FFB547; --wip-dot: #FF9F0A; --wip-soft: #33240C; --sync: #4DA3FF; --sync-soft: #10243F; --lane: rgb(255 255 255 / .03); --lane-line: #3A3A42; --e-entrada: #9C98F2; --e-pedir: #E07AAE; --e-procurar: #F0A05E; --e-combinar: #6CCB7F; --e-contaC: #78ACEB; --e-cadastro: #B394F0; --e-chamados: #F08D6C; --e-servico: #5FCDBF; --e-contaP: #A3B4C6;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F0F11; --grid: #24242A; --surface: #19191C; --surface-2: #232328; --ink: #F2F2F5; --muted: #9C9CA6;
  --line: #34343B; --edge: #D8D8DE; --edge-auto: #6E6E78; --app: #4CD07A; --app-dot: #34C759; --app-soft: #12301D;
  --wip: #FFB547; --wip-dot: #FF9F0A; --wip-soft: #33240C; --sync: #4DA3FF; --sync-soft: #10243F; --lane: rgb(255 255 255 / .03); --lane-line: #3A3A42; --e-entrada: #9C98F2; --e-pedir: #E07AAE; --e-procurar: #F0A05E; --e-combinar: #6CCB7F; --e-contaC: #78ACEB; --e-cadastro: #B394F0; --e-chamados: #F08D6C; --e-servico: #5FCDBF; --e-contaP: #A3B4C6;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 18px rgb(0 0 0 / .35); color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); overflow: hidden; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sync); outline-offset: 2px; }

/* Topo */
.top { flex: none; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; position: relative; z-index: 5; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.app { background: var(--app-dot); } .dot.desenho { background: var(--ink); } .dot.andamento { background: var(--wip-dot); }
.lk { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--edge); }
.lk.auto { border-top: 2px dashed var(--edge-auto); } .lk.sync { border-top: 2px dashed var(--sync); }
.search { margin-left: auto; position: relative; }
.search input { width: 200px; max-width: 46vw; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.search ul { position: absolute; right: 0; top: calc(100% + 6px); list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); width: 260px; max-height: 300px; overflow: auto; }
.search li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 9px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.search li button:hover, .search li button:focus-visible { background: var(--surface-2); }

/* Tela do fluxograma */
.stage { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--bg); background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 22px 22px; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.cluster { position: absolute; border: 1.5px solid var(--lane-line); background: var(--lane); border-radius: 26px; }
.cluster span { position: absolute; left: 22px; top: 16px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
path.entre { opacity: .5; }
/* Árvore deitada: cartões com a cor da etapa, galhos curvos, rótulo do toque junto da seta. */
.node { border: 1.5px solid var(--c, var(--line)); }
.node .lado { align-self: flex-start; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.node .lado.profissional { color: var(--e-chamados); }
.node .lado.cliente { color: var(--e-contaC); }
.node.andamento { border: 1.5px dashed var(--wip-dot); }
.node.ref { flex-direction: row; align-items: center; gap: 10px; padding: 6px 12px; border: 1.5px dashed var(--c); border-radius: 14px; background: var(--surface); box-shadow: none; }
.node.ref .seta { font-size: 18px; color: var(--c); font-weight: 700; line-height: 1; }
.node.ref .rt { display: flex; flex-direction: column; min-width: 0; }
.node.ref .d { font-size: 10.5px; color: var(--muted); }
.node.ref .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node.ref[data-vista] { border-style: solid; background: var(--surface-2); }
.elabel { transform: translate(-100%, -130%); border-color: var(--c, var(--line)); color: var(--c, var(--ink)); font-weight: 600; max-width: 200px; white-space: normal; text-align: right; }
.elabel.auto { color: var(--muted); }

.cluster.lado-profissional span::before { content: "Profissional · "; color: var(--ink); }
.cluster.lado-cliente span::before { content: "Cliente · "; color: var(--ink); }

.node { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: box-shadow .15s, opacity .2s; }
.node:hover { box-shadow: 0 0 0 2px var(--edge), var(--shadow); }
.node.sel { box-shadow: 0 0 0 3px var(--sync), var(--shadow); }
.node.dim { opacity: .28; }
.node .hd { display: flex; align-items: center; gap: 6px; min-width: 0; }
.code { font-family: var(--font-code); font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.node { box-sizing: border-box; }
.node .nm { font-size: 13px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.node .hd, .node .lado { flex: none; }
/* A tela inteira, sem cortar: o quadro tem a proporção exata do celular e não encolhe. */
.node .shot { flex: none; width: 100%; aspect-ratio: 393 / 852; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-sizing: content-box; }
.node .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.pill.app { background: var(--app-soft); color: var(--app); }
.pill.desenho { background: var(--surface-2); color: var(--ink); }
.pill.andamento { background: var(--wip-soft); color: var(--wip); }
.node .notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); line-height: 1.35; }
.node .notes li::before { content: "↻ "; }
.node.andamento { border: 1.5px dashed var(--wip-dot); background: var(--wip-soft); box-shadow: none; justify-content: center; }
.node.andamento .nm { color: var(--ink); }

.elabel { position: absolute; transform: translate(-50%, -50%); background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 11px; font-weight: 500; line-height: 1.25; padding: 3px 8px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
.elabel.auto { color: var(--muted); font-style: italic; border-style: dashed; }
.elabel.sync { color: var(--sync); border-color: var(--sync); background: var(--sync-soft); }
.elabel.dim { opacity: .25; }

/* Zoom */
.zoom { position: absolute; z-index: 4; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); align-items: center; }
.zoom button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 17px; font-weight: 600; }
.zoom button:hover { background: var(--surface-2); }
.zoom .fit { width: auto; padding: 0 12px; border-radius: 999px; font-size: 12.5px; }
.zoom output { font-family: var(--font-code); font-size: 11px; color: var(--muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.hint { position: absolute; z-index: 4; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }

/* Painel */
.panel { position: absolute; z-index: 6; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: min(380px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 40px rgb(0 0 0 / .18); display: flex; flex-direction: column; overflow: hidden; }
.panel .ph { padding: 16px 16px 12px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.panel .ph h2 { margin: 2px 0 6px; font-size: 18px; letter-spacing: -.02em; text-wrap: balance; }
.panel .x { margin-left: auto; border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex: none; font-size: 16px; }
.panel .pb { overflow: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.panel .big { flex: none; width: 100%; max-width: 260px; margin: 0 auto; aspect-ratio: 393 / 852; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.panel .big img { width: 100%; height: 100%; display: block; }
.panel h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.panel li button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.panel li button:hover { background: var(--surface-2); }
.panel li .t { font-size: 13px; font-weight: 600; }
.panel li .d { font-size: 12px; color: var(--muted); grid-column: 1; }
.panel li .arrow { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); }
.panel .note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0; }
.panel .path { font-family: var(--font-code); font-size: 11px; color: var(--muted); word-break: break-all; }
@media (max-width: 640px) {
  .panel { top: auto; left: 8px; right: 8px; width: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-height: 72%; }
  .panel .big { max-width: 180px; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; max-width: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .world { transition: none !important; } }
</style>

// Caminho publicado da imagem: telas/cliente/<arquivo> ou telas/profissional/<arquivo>
const pub = p => 'telas/' + (p.startsWith('design/user/') ? 'cliente/' : 'profissional/') + p.split('/').pop();
const TELAS = TELAS_RAW.map(([id, cod, nome, etapa, status, repo, notas]) => ({
  id, cod, nome, etapa, status, repo, notas: notas || [],
  img: repo ? (repo.startsWith('docs/fluxo/') ? repo.slice(11) : pub(repo)) : null,
  lado: ETAPAS[etapa].lado,
}));
const POR_ID = Object.fromEntries(TELAS.map(t => [t.id, t]));
LIGACOES.forEach(([de, para]) => { if (!POR_ID[de] || !POR_ID[para]) console.error('Ligação inválida', de, para); });

const STATUS = { app: 'No app', desenho: 'Desenhada', andamento: 'Em andamento' };
// Cada vista é uma árvore: começa na raiz e abre um galho por toque.
const VISTAS = {
  cliente: { raiz: 'e01', etapas: ['entrada', 'pedir', 'procurar', 'combinar', 'contaC'], tirar: [],
    titulo: 'Do primeiro acesso até o serviço pago e avaliado, pelo lado de quem pede.' },
  profissional: { raiz: 'e01', etapas: ['entrada', 'cadastro', 'chamados', 'servico', 'contaP'], tirar: ['e03', 'e05'],
    titulo: 'Do cadastro até receber pelo serviço, pelo lado de quem trabalha.' },
  ambos: { raiz: 'c10', etapas: ['procurar', 'combinar', 'chamados', 'servico'], tirar: [], sincronia: true,
    titulo: 'Um pedido do começo ao fim: o que cada lado vê no mesmo momento.' },
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stage = $('#stage'), world = $('#world'), panel = $('#panel');
let vista = 'cliente', view = { x: 0, y: 0, k: 1 }, layout = null, selecionada = null;

function telasDaVista(v) {
  const cfg = VISTAS[v];
  return TELAS.filter(t => cfg.etapas.includes(t.etapa) && !cfg.tirar.includes(t.id));
}
function vistaDe(id) {
  return Object.keys(VISTAS).find(v => telasDaVista(v).some(t => t.id === id));
}

// Ligações com as duas pontas conhecidas; toques repetidos entre as mesmas telas viram um só rótulo.
function ligacoesDaVista(v) {
  const grupos = new Map();
  for (const [de, para, toque, tipo] of LIGACOES) {
    if (tipo === 's' && !VISTAS[v].sincronia) continue;
    const k = de + '>' + para + '>' + tipo;
    if (!grupos.has(k)) grupos.set(k, { de, para, tipo, toques: [] });
    if (!grupos.get(k).toques.includes(toque)) grupos.get(k).toques.push(toque);
  }
  return [...grupos.values()].map(g => ({ ...g, rotulo: g.toques.join(' · ') }));
}

/* Árvore: busca em largura a partir da raiz. Cada tela abre seus galhos uma vez só,
   no primeiro lugar em que aparece; nas outras vezes vira uma folha de atalho (↪). */
const CARD = { w: 150, shot: 130 };
const GAP = { x: 230, y: 18 };
function altura(item) {
  if (item.tipo === 'tela') {
    const t = POR_ID[item.id];
    if (t.status === 'andamento') return 70 + (t.nome.length > 20 ? 16 : 0);
    // Medidas reais do cartão: bordas e espaço interno 23 · cabeçalho 18 · 2 vãos de 8 ·
    // nome (até 2 linhas de 16,25) · tela (largura interna 127 na proporção 393×852, + borda 2).
    const linhas = t.nome.length > 17 ? 2 : 1;
    const tela = (CARD.w - 23) * 852 / 393 + 2;
    return Math.ceil(23 + 18 + 16 + 16.25 * linhas + tela + (VISTAS[vista].sincronia ? 26 : 0)) + 2;
  }
  return 44;
}
function montar() {
  const cfg = VISTAS[vista];
  const telas = telasDaVista(vista), dentro = new Set(telas.map(t => t.id));
  const todas = ligacoesDaVista(vista);
  const ligs = todas.filter(l => dentro.has(l.de) && dentro.has(l.para));
  const saindo = id => todas.filter(l => l.de === id);

  const raiz = { tipo: 'tela', id: cfg.raiz, filhos: [], prof: 0 };
  const visto = new Set([cfg.raiz]), fila = [raiz], ocorrencia = { [cfg.raiz]: raiz };
  while (fila.length) {
    const no = fila.shift();
    for (const l of saindo(no.id)) {
      let filho;
      if (!dentro.has(l.para)) filho = { tipo: 'fora', id: l.para, vista: vistaDe(l.para) };
      else if (visto.has(l.para)) filho = { tipo: 'atalho', id: l.para };
      else {
        visto.add(l.para);
        filho = { tipo: 'tela', id: l.para, filhos: [] };
        ocorrencia[l.para] = filho;
        fila.push(filho);
      }
      filho.lig = l; filho.prof = no.prof + 1; filho.pai = no;
      no.filhos.push(filho);
    }
  }
  // Galhos curtos no meio (perto da tela que os abre), galhos grandes nas pontas.
  function ordenar(n) {
    if (n.tipo !== 'tela' || !n.filhos.length) return 1;
    const tam = new Map(n.filhos.map(f => [f, ordenar(f)]));
    const asc = [...n.filhos].sort((a, b) => tam.get(a) - tam.get(b));
    const meio = [];
    asc.forEach((f, i) => (i % 2 ? meio.push(f) : meio.unshift(f)));
    n.filhos = meio;
    return 1 + [...tam.values()].reduce((a, b) => a + b, 0);
  }
  ordenar(raiz);
  // Telas da vista que a raiz não alcança entram como raízes extras, embaixo.
  const raizes = [raiz];
  for (const t of telas) if (!visto.has(t.id)) {
    const r = { tipo: 'tela', id: t.id, filhos: [], prof: 0 }; visto.add(t.id); raizes.push(r); ocorrencia[t.id] = r;
  }

  /* Posição por contorno: cada galho guarda, coluna por coluna, até onde vai em cima e embaixo.
     Os irmãos são empilhados o mais perto possível sem se encostar em nenhuma coluna,
     e o pai fica no meio do primeiro e do último filho. */
  const itens = [];
  function contorno(n) {
    n.h = altura(n);
    const meu = [[-n.h / 2, n.h / 2]];
    if (n.tipo !== 'tela' || !n.filhos.length) return meu;
    const juntos = [];
    n.filhos.forEach((f, i) => {
      const c = contorno(f);
      let off = 0;
      if (i > 0) {
        off = -Infinity;
        for (let d = 0; d < c.length && d < juntos.length; d++) off = Math.max(off, juntos[d][1] - c[d][0] + GAP.y);
      }
      f.off = off;
      c.forEach(([a, b], d) => {
        if (!juntos[d]) juntos[d] = [a + off, b + off];
        else juntos[d] = [Math.min(juntos[d][0], a + off), Math.max(juntos[d][1], b + off)];
      });
    });
    const meio = (n.filhos[0].off + n.filhos[n.filhos.length - 1].off) / 2;
    n.filhos.forEach(f => (f.off -= meio));
    juntos.forEach(([a, b]) => meu.push([a - meio, b - meio]));
    return meu;
  }
  function posicionar(n, y) {
    n.x = 60 + n.prof * (CARD.w + GAP.x);
    n.y = y;
    itens.push(n);
    if (n.tipo === 'tela') n.filhos.forEach(f => posicionar(f, y + f.off));
  }
  let topo = 70;
  for (const r of raizes) {
    const c = contorno(r);
    const cima = Math.min(...c.map(p => p[0])), baixo = Math.max(...c.map(p => p[1]));
    posicionar(r, topo - cima);
    topo += baixo - cima + 120;
  }
  const prof = Math.max(...itens.map(i => i.prof));
  layout = { telas, ligs: todas.filter(l => dentro.has(l.de)), itens, ocorrencia,
    w: 60 * 2 + (prof + 1) * CARD.w + prof * GAP.x + 40, h: topo - 120 + 70 };
  desenhar();
}

function corDe(id) { return `var(--e-${POR_ID[id].etapa})`; }

function desenhar() {
  const { itens, w, h } = layout;
  const sinc = VISTAS[vista].sincronia;
  let svg = `<svg width="${w}" height="${h}" aria-hidden="true"><defs>`;
  for (const e of Object.keys(ETAPAS).concat('sync')) {
    const c = e === 'sync' ? 'var(--sync)' : `var(--e-${e})`;
    svg += `<marker id="m-${e}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="${c}"/></marker>`;
  }
  svg += '</defs>';
  let html = '', rotulos = '';
  for (const n of itens) {
    const t = POR_ID[n.id];
    const largura = n.tipo === 'tela' ? CARD.w : 230;
    const pos = `left:${n.x}px;top:${n.y - n.h / 2}px;width:${largura}px;height:${n.h}px;--c:${corDe(n.id)}`;
    if (n.pai) {
      const l = n.lig, p = n.pai;
      const x0 = p.x + CARD.w, y0 = p.y, x1 = n.x - 3, y1 = n.y;
      const sync = l.tipo === 's', etapa = sync ? 'sync' : t.etapa;
      const cor = sync ? 'var(--sync)' : `var(--e-${t.etapa})`;
      const dash = l.tipo === 't' ? '' : l.tipo === 'e' || l.tipo === 'alt' ? '2 5' : '7 6';
      const mx = x0 + (x1 - x0) * 0.42;
      svg += `<path data-de="${l.de}" data-para="${l.para}" d="M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1}" fill="none" stroke="${cor}" stroke-width="1.8" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linecap="round" marker-end="url(#m-${etapa})"/>`;
      rotulos += `<div class="elabel ${sync ? 'sync' : l.tipo === 't' ? '' : 'auto'}" data-de="${l.de}" data-para="${l.para}" style="left:${x1 - 14}px;top:${y1}px;--c:${cor}">${esc(l.rotulo)}</div>`;
    }
    if (n.tipo === 'atalho' || n.tipo === 'fora') {
      const fora = n.tipo === 'fora';
      const txt = fora ? `Abre o fluxo do ${n.vista === 'profissional' ? 'profissional' : 'cliente'}` : 'Segue em';
      html += `<div class="node ref" data-alvo="${n.id}" ${fora ? `data-vista="${n.vista}"` : ''} style="${pos}" role="button" tabindex="0">
        <span class="seta">${fora ? '⇢' : '↪'}</span><span class="rt"><span class="d">${txt}</span><span class="nm">${t.cod !== '—' ? `<span class="code">${t.cod}</span> ` : ''}${esc(t.nome)}</span></span></div>`;
    } else if (t.status === 'andamento') {
      html += `<div class="node andamento" data-id="${t.id}" style="${pos}" role="button" tabindex="0" aria-label="${esc(t.nome)}, em andamento">
        <span class="pill andamento"><span class="dot andamento"></span>Em andamento</span><div class="nm">${esc(t.nome)}</div></div>`;
    } else {
      html += `<div class="node" data-id="${t.id}" style="${pos}" role="button" tabindex="0" aria-label="${esc(t.cod + ' ' + t.nome)}">
        <div class="hd"><span class="code">${t.cod}</span><span class="pill ${t.status}" style="margin-left:auto"><span class="dot ${t.status}"></span>${STATUS[t.status]}</span></div>
        ${sinc ? `<span class="lado ${t.lado}">${t.lado === 'cliente' ? 'Cliente' : 'Profissional'}</span>` : ''}
        <div class="nm">${esc(t.nome)}</div>
        <div class="shot"><img alt="" decoding="async" src="${esc(t.img)}" data-repo="${esc(t.repo)}"></div></div>`;
    }
  }
  svg += '</svg>';
  world.style.width = w + 'px';
  world.style.height = h + 'px';
  world.innerHTML = svg + html + rotulos;
  world.querySelectorAll('img').forEach(img => img.addEventListener('error', () => {
    if (img.dataset.tried) return; img.dataset.tried = 1;
    img.src = '../../' + img.dataset.repo.split('/').map(encodeURIComponent).join('/');
  }));
  $('#sub').textContent = VISTAS[vista].titulo;
  legenda(layout.telas);
  if (selecionada && !layout.ocorrencia[selecionada]) selecionada = null;
  realcar();
}

function legenda(telas) {
  const c = { app: 0, desenho: 0, andamento: 0 };
  telas.forEach(t => c[t.status]++);
  $('#legend').innerHTML = `
    <span class="k"><span class="dot app"></span>No app <b>${c.app}</b></span>
    <span class="k"><span class="dot desenho"></span>Desenhada <b>${c.desenho}</b></span>
    <span class="k"><span class="dot andamento"></span>Em andamento <b>${c.andamento}</b></span>
    <span class="k"><span class="lk"></span>toque</span>
    <span class="k"><span class="lk auto"></span>automático</span>
    <span class="k">↪ segue numa tela que já aparece em outro galho</span>
    ${VISTAS[vista].sincronia ? '<span class="k"><span class="lk sync"></span>o outro lado recebe</span>' : ''}`;
}

/* ===== PAN / ZOOM ===== */
function aplicar() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  $('#zval').textContent = Math.round(view.k * 100) + '%';
}
function zoomEm(k, cx, cy) {
  k = Math.min(2.5, Math.max(0.06, k));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k; aplicar();
}
function ajustar() {
  const r = stage.getBoundingClientRect();
  view.k = Math.max(0.06, Math.min(1, Math.min(r.width / layout.w, r.height / layout.h) * 0.96));
  view.x = (r.width - layout.w * view.k) / 2;
  view.y = (r.height - layout.h * view.k) / 2;
  aplicar();
}
// Abertura: a raiz à esquerda, na altura do meio da tela, num tamanho legível.
function inicio() {
  const r = stage.getBoundingClientRect(), raiz = layout.itens[0];
  view.k = r.width < 640 ? 0.42 : 0.6;
  view.x = 24 - raiz.x * view.k;
  view.y = r.height / 2 - raiz.y * view.k;
  aplicar();
}
function centrar(id) {
  const n = layout.ocorrencia[id]; if (!n) return;
  const r = stage.getBoundingClientRect();
  view.k = Math.max(view.k, 0.55);
  const larguraUtil = panel.hidden || r.width < 640 ? r.width : r.width - 400;
  const alturaUtil = r.width < 640 && !panel.hidden ? r.height * 0.32 : r.height;
  view.x = larguraUtil / 2 - (n.x + CARD.w / 2) * view.k;
  view.y = alturaUtil / 2 - n.y * view.k;
  aplicar();
}
function irPara(id, v) {
  if (v && v !== vista) trocar(v);
  if (!layout.ocorrencia[id]) { const outra = vistaDe(id); if (outra && outra !== vista) trocar(outra); }
  abrir(id); centrar(id);
}

const toques = new Map();
let arrasto = null, pinca = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.zoom, .panel, .hint')) return;
  stage.setPointerCapture(e.pointerId);
  toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (toques.size === 1) arrasto = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moveu: false, alvo: e.target.closest('.node') };
  if (toques.size === 2) {
    const [a, b] = [...toques.values()];
    pinca = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
    arrasto = null;
  }
});
stage.addEventListener('pointermove', e => {
  if (!toques.has(e.pointerId)) return;
  toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinca && toques.size === 2) {
    const [a, b] = [...toques.values()], r = stage.getBoundingClientRect();
    zoomEm(pinca.k * Math.hypot(a.x - b.x, a.y - b.y) / pinca.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (arrasto) {
    const dx = e.clientX - arrasto.x, dy = e.clientY - arrasto.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { arrasto.moveu = true; stage.classList.add('dragging'); }
    view.x = arrasto.vx + dx; view.y = arrasto.vy + dy; aplicar();
  }
});
function tocarNo(no) {
  if (no.dataset.alvo) irPara(no.dataset.alvo, no.dataset.vista);
  else abrir(no.dataset.id);
}
function soltar(e) {
  if (arrasto && !arrasto.moveu) {
    if (arrasto.alvo) tocarNo(arrasto.alvo);
    else fechar();
  }
  toques.delete(e.pointerId);
  if (toques.size < 2) pinca = null;
  if (toques.size === 0) arrasto = null;
  stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', soltar);
stage.addEventListener('pointercancel', soltar);
stage.addEventListener('wheel', e => {
  if (e.target.closest('.panel')) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mouse = e.deltaMode === 1 || (!e.deltaX && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
  if (e.ctrlKey || mouse) zoomEm(view.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; aplicar(); }
}, { passive: false });
$('#zin').onclick = () => { const r = stage.getBoundingClientRect(); zoomEm(view.k * 1.25, r.width / 2, r.height / 2); };
$('#zout').onclick = () => { const r = stage.getBoundingClientRect(); zoomEm(view.k / 1.25, r.width / 2, r.height / 2); };
$('#zfit').onclick = ajustar;
world.addEventListener('keydown', e => {
  const n = e.target.closest('.node');
  if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tocarNo(n); }
});

/* ===== PAINEL ===== */
function itemLig(id, rotulo, tipo, sentido) {
  const t = POR_ID[id];
  const tipoTxt = { a: 'automático', e: 'outro estado', alt: 'alternativa', s: 'no outro lado', t: '' }[tipo];
  return `<li><button data-ir="${id}"><span class="t">${esc(rotulo)}</span><span class="d">${sentido} ${t.cod !== '—' ? t.cod + ' · ' : ''}${esc(t.nome)}${tipoTxt ? ' · ' + tipoTxt : ''}</span><span class="arrow">›</span></button></li>`;
}
function abrir(id) {
  const t = POR_ID[id]; if (!t) return;
  selecionada = id;
  const todas = ligacoesDaVista(vista);
  const sai = todas.filter(l => l.de === id), entra = todas.filter(l => l.para === id);
  panel.innerHTML = `
    <div class="ph"><div><span class="code">${t.cod}</span>
      <h2>${esc(t.nome)}</h2>
      <span class="pill ${t.status}"><span class="dot ${t.status}"></span>${STATUS[t.status]}</span>
      <span class="pill desenho" style="margin-left:4px">${esc(ETAPAS[t.etapa].nome)}</span></div>
      <button class="x" id="fechar" aria-label="Fechar">✕</button></div>
    <div class="pb">
      ${t.img ? `<div class="big"><img alt="${esc(t.nome)}" src="${esc(t.img)}" data-repo="${esc(t.repo)}"></div>` :
        `<p class="note">Esta tela ainda não foi desenhada. Ela aparece aqui porque um toque leva até ela.</p>`}
      ${t.notas.length ? `<div><h3>Observações</h3><ul>${t.notas.map(n => `<li class="note">↻ ${esc(n)}</li>`).join('')}</ul></div>` : ''}
      <div><h3>Toques nesta tela</h3>${sai.length ? `<ul>${sai.map(l => itemLig(l.para, l.rotulo, l.tipo, 'abre')).join('')}</ul>` : '<p class="note">Nenhum toque mapeado ainda.</p>'}</div>
      <div><h3>Como se chega aqui</h3>${entra.length ? `<ul>${entra.map(l => itemLig(l.de, l.rotulo, l.tipo, 'vindo de')).join('')}</ul>` : '<p class="note">É a primeira tela.</p>'}</div>
      ${t.repo ? `<div><h3>Arquivo</h3><p class="path">${esc(t.repo)}</p></div>` : ''}
    </div>`;
  panel.hidden = false;
  const big = panel.querySelector('.big img');
  if (big) big.addEventListener('error', () => { if (!big.dataset.tried) { big.dataset.tried = 1; big.src = '../../' + big.dataset.repo.split('/').map(encodeURIComponent).join('/'); } });
  $('#fechar').onclick = fechar;
  panel.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => irPara(b.dataset.ir));
  realcar();
}
function fechar() { panel.hidden = true; selecionada = null; realcar(); }
function realcar() {
  const viz = new Set();
  if (selecionada) {
    viz.add(selecionada);
    ligacoesDaVista(vista).forEach(l => { if (l.de === selecionada) viz.add(l.para); if (l.para === selecionada) viz.add(l.de); });
  }
  world.querySelectorAll('.node').forEach(n => {
    const id = n.dataset.id || n.dataset.alvo;
    n.classList.toggle('sel', !!n.dataset.id && id === selecionada);
    n.classList.toggle('dim', !!selecionada && !viz.has(id));
  });
  world.querySelectorAll('path[data-de]').forEach(p => {
    const on = p.dataset.de === selecionada || p.dataset.para === selecionada;
    p.style.opacity = !selecionada ? '' : on ? 1 : 0.12;
  });
  world.querySelectorAll('.elabel').forEach(l => {
    l.classList.toggle('dim', !!selecionada && l.dataset.de !== selecionada && l.dataset.para !== selecionada);
  });
}

/* ===== BUSCA ===== */
const busca = $('#busca'), res = $('#resultados');
const sem = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
busca.addEventListener('input', () => {
  const q = sem(busca.value.trim());
  if (!q) { res.hidden = true; return; }
  const achados = TELAS.filter(t => sem(t.nome + ' ' + t.cod).includes(q)).slice(0, 12);
  res.innerHTML = achados.length ? achados.map(t => `<li><button data-id="${t.id}"><span class="dot ${t.status}"></span><span class="code">${t.cod}</span>${esc(t.nome)}</button></li>`).join('') : '<li class="note" style="padding:8px">Nenhuma tela com esse nome.</li>';
  res.hidden = false;
  res.querySelectorAll('button').forEach(b => b.onclick = () => { res.hidden = true; busca.value = ''; irPara(b.dataset.id); });
});
busca.addEventListener('keydown', e => { if (e.key === 'Escape') { busca.value = ''; res.hidden = true; } if (e.key === 'Enter') res.querySelector('button')?.click(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) fechar(); });

/* ===== VISTAS ===== */
function trocar(v, primeira) {
  if (!VISTAS[v]) v = 'cliente';
  vista = v;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  fechar();
  montar();
  inicio();
  if (!primeira && location.hash !== '#' + v) history.replaceState(null, '', '#' + v);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => trocar(b.dataset.v));
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== vista) trocar(location.hash.slice(1)); });
window.addEventListener('resize', () => { if (layout) aplicar(); });
// O foco numa tela faz o navegador rolar a área por conta própria e tira o painel do lugar:
// a área nunca rola (o movimento é só pelo arrastar/zoom); a tela focada é centralizada.
stage.addEventListener('scroll', () => { stage.scrollLeft = 0; stage.scrollTop = 0; });
world.addEventListener('focusin', e => {
  const n = e.target.closest('.node[data-id]');
  if (n && e.target.matches(':focus-visible')) centrar(n.dataset.id);
});
$('#data').textContent = ATUALIZADO;
trocar(location.hash.slice(1) || 'cliente', true);
</script>
